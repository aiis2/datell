name: Compile and Test

on:
  pull_request:
  push:
    branches:
      - master
      - 'codex/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Write build flags
        run: node scripts/write-build-flags.js

      - name: Build icon sprite
        run: node scripts/build-icon-sprite.js

      - name: Build system RAG index
        run: node scripts/build-system-rag.js

      - name: Type-check Electron main process
        run: npx tsc -p src/main/tsconfig.json

      - name: Type-check workspace
        run: npx tsc --noEmit

      - name: Build renderer
        run: npx vite build

      - name: Run focused regression tests
        run: |
          node tests/save-report-template-tool.test.cjs
          node tests/agent-template-insertion.test.cjs
          node tests/system-prompt-template-generation.test.cjs
          node tests/built-in-skill-manifests.test.cjs
